<header>
  <h1><span lang="ja">体めぐり</span> Karada Meguri</h1>
  <p>Um passeio pelo corpo: descubra o nome de cada parte em japonês. · <a href="index.html">← Ayumi</a></p>
</header>

<main id="app"></main>

<footer>Cada rodada tem até 10 partes. No modo “Tocar”, o desenho vira de costas ou se aproxima sozinho. Os órgãos estão em posições esquemáticas, só para estudar os nomes. Atalhos: 1–4 respondem, Enter avança.</footer>

<script src="data/words.js"></script>
<script src="data/zonas.js"></script>
<script src="data/body.js"></script>
<script src="tts.js"></script>
<script>
window.KARADA = Zonas.mount(document.getElementById("app"), {
  prefix: "corpo", data: BODY, aria: "Desenho esquemático do corpo humano",
  text: { unit: "parte", tocarBtn: "Tocar na parte", ask1: "Que parte está piscando?", ask2: "Como se diz esta parte? Digite em hiragana ou romaji (kanji também vale).", ask3: "Toque na parte do corpo que esta palavra nomeia." }
});
</script>
