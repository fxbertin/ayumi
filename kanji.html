<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanji – Ayumi</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2742">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="pwa.js" defer></script>
<script src="tts.js"></script>
<style>
.setrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:12px 0}
select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.opt.kj{font-size:2rem;line-height:1.3}
.ans-card{text-align:left;margin-top:8px}
.ans-card .jp{font-size:2rem;font-weight:600}
a{color:inherit}
.rd-box{margin:8px 0 2px;text-align:left}
.rd{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin:6px 0}
.rd-r{color:var(--muted);min-width:5.5em}
.rd-p{color:var(--muted);font-size:.9rem}
.rd-b{padding:0 6px}
.sk{display:grid;grid-template-columns:3.2rem 1fr;gap:2px 12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.sk-k{font-size:2.2rem;line-height:1.2;grid-row:span 2}
.sk-m{font-weight:600}
.sk-r{color:var(--muted)}
.sk details{grid-column:2}
.sk summary{cursor:pointer;color:var(--muted);font-size:.9rem}
#feed-list .sk{padding:24px 0}
#feed-list .sk-k{font-size:3rem}
#feed-list .sk-m{font-size:1.15rem}
#feed-list .sk .rd-box{grid-column:2}
.rd-list{margin:2px 0 10px 4px;font-size:.95rem}
</style>
</head>
<body>
<header>
  <h1><span lang="ja">漢字道場</span> Kanji</h1>
  <p>Treine as leituras dos kanji por nível JLPT. · <a href="index.html">← Ayumi</a></p>
</header>

<main>
  <section id="menu">
    <div class="setrow">
      <div class="seg" role="group" aria-label="Modo">
        <button id="m-k2r" type="button">Kanji → leitura</button>
        <button id="m-r2k" type="button">Leitura → kanji</button>
        <button id="m-study" type="button">Só estudar</button>
      </div>
    </div>
    <div class="setrow">
      <label>Nível: <select id="level"></select></label>
      <button id="go" type="button" class="primary">Começar</button>
      <button id="feed-open" type="button" class="primary">∞ Rolagem infinita</button>
    </div>
    <p id="msg" class="feedback" aria-live="polite"></p>
  </section>

  <section id="study" hidden>
    <div class="top">
      <button id="study-back" type="button" class="ghost">← Menu</button>
      <b id="study-title"></b>
      <span id="study-count"></span>
    </div>
    <div id="study-list"></div>
    <div class="row"><button id="study-more" type="button" class="ghost" hidden>Mostrar mais</button></div>
    <div class="row"><button id="study-play" type="button" class="primary">Jogar este nível</button>
      <button id="study-feed" type="button" class="ghost">∞ Rolar este nível</button></div>
  </section>

  <section id="feed" hidden>
    <div class="feedbar">
      <button id="feed-back" type="button" class="ghost">← Menu</button>
      <select id="feed-scope" aria-label="Quais kanji"></select>
      <label><input type="checkbox" id="feed-shuffle" checked> Embaralhar</label>
      <span id="feed-info"></span>
    </div>
    <div id="feed-list"></div>
    <div id="feed-end" aria-hidden="true"></div>
  </section>

  <section id="game" hidden>
    <div class="top"><span id="score"></span><span class="stamp" lang="ja">漢</span></div>
    <div class="card">
      <div id="big" class="big" lang="ja"></div>
      <div id="hint" class="hint"></div>
    </div>
    <div id="opts" class="opts"></div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <div id="reveal" class="card ans-card" hidden></div>
    <div class="row"><button id="next" type="button" class="primary" hidden>Próxima</button></div>
  </section>

  <section id="result" hidden>
    <h2 id="final"></h2>
    <p id="best"></p>
    <div id="review"></div>
    <div class="row">
      <button id="again" type="button" class="primary">Jogar de novo</button>
      <button id="home" type="button" class="ghost">Voltar ao menu</button>
    </div>
  </section>
</main>

<footer>Kun (leitura japonesa) em hiragana, on (leitura chinesa) em katakana; o que está entre parênteses é okurigana. Atalhos: 1–4 escolhem, Enter avança.</footer>

<script src="data/kanji.js"></script>
<script src="data/kanji-ex.js"></script>
<script>
const $ = s => document.querySelector(s);
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const base = r => r.replace(/\(.*?\)/g, "");                       // "おお(きい)" -> "おお"
const toH = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 96)); // katakana -> hiragana
// <readings-box>
const KEX = typeof KANJI_EX === "undefined" ? {} : KANJI_EX;
function say(t) { AyumiTTS.speak(t); }
function readingsBox(e) {
  const box = document.createElement("div"); box.className = "rd-box"; box.lang = "ja";
  const ex = KEX[e.k];
  if (!ex) { box.textContent = `kun: ${e.kun.join("、") || "—"}　on: ${e.on.join("、") || "—"}`; return box; }
  [["kun", e.kun], ["on", e.on]].forEach(([t, list]) => list.forEach(r => {
    const m = ex.find(x => x[0] === toH(base(r)) && x[1] === t);
    const row = document.createElement("div"); row.className = "rd";
    const lab = document.createElement("span"); lab.className = "rd-r"; lab.textContent = `${t} ${r}`;
    row.append(lab);
    if (m) {
      const w = document.createElement("span"); w.className = "rd-w"; w.textContent = `${m[2]}（${m[3]}）`;
      const p = document.createElement("span"); p.className = "rd-p"; p.lang = "pt-BR"; p.textContent = m[4] + (m[5] ? " · leitura rara" : "");
      row.append(w, p);
      if (AyumiTTS.supported()) {
        const b = document.createElement("button"); b.type = "button"; b.className = "ghost rd-b"; b.textContent = "🔊";
        b.setAttribute("aria-label", "Ouvir " + m[3]); b.onclick = () => say(m[3]); row.append(b);
      }
    }
    box.append(row);
  }));
  return box;
}
// </readings-box>
const ENT = KANJI.map(([k, lv, kun, on, mean]) => ({ k, lv, kun, on, mean, all: [...kun, ...on], set: new Set([...kun, ...on].map(r => toH(base(r)))) }));
const S = { mode: ["r2k", "study"].includes(ls.get("kd-kanji-mode")) ? ls.get("kd-kanji-mode") : "k2r", qm: ls.get("kd-kanji-qm") === "r2k" ? "r2k" : "k2r", q: [], i: 0, score: 0, wrong: [], locked: false };

// Kanji → leitura: uma leitura correta (kun ou on) e 3 leituras do mesmo tipo que não servem para esse kanji.
function readingQ(e, pool) {
  const types = ["kun", "on"].filter(t => e[t].length), t = types[Math.floor(Math.random() * types.length)];
  const ans = e[t][Math.floor(Math.random() * e[t].length)], used = new Set([toH(base(ans))]), dist = [];
  for (const src of [pool, ENT]) {
    for (const r of shuffle(src.filter(x => x !== e).flatMap(x => x[t]))) {
      const b = toH(base(r));
      if (e.set.has(b) || used.has(b)) continue;
      used.add(b); dist.push(r); if (dist.length === 3) break;
    }
    if (dist.length === 3) break;
  }
  return { e, big: e.k, hint: "Qual é uma leitura deste kanji?", cls: "", opts: shuffle([{ label: ans, ok: true }, ...dist.map(label => ({ label, ok: false }))]) };
}
// Leitura → kanji: mostra uma leitura e o significado; 3 kanji que não têm essa leitura.
function kanjiQ(e, pool) {
  const r = e.all[Math.floor(Math.random() * e.all.length)], b = toH(base(r)), dist = [];
  for (const src of [pool, ENT]) {
    for (const x of shuffle(src.filter(x => x !== e && !x.set.has(b) && !dist.includes(x)))) { dist.push(x); if (dist.length === 3) break; }
    if (dist.length === 3) break;
  }
  return { e, big: r, hint: `Significado: ${e.mean}. Qual kanji tem essa leitura?`, cls: " kj", opts: shuffle([{ label: e.k, ok: true }, ...dist.map(x => ({ label: x.k, ok: false }))]) };
}
function build() {
  const lv = $("#level").value, pool = ENT.filter(e => lv === "all" || e.lv === lv);
  S.pool = pool;
  S.q = shuffle(pool).slice(0, Math.min(10, pool.length)).map(e => S.qm === "k2r" ? readingQ(e, pool) : kanjiQ(e, pool));
}
const SECS = ["menu", "game", "result", "study", "feed"];
const showSec = id => SECS.forEach(s => $("#" + s).hidden = s !== id);
function start() { if (S.mode === "study") study(); else play(); }
function play() {
  ls.set("kd-kanji-level", $("#level").value);
  build();
  if (S.q.length < 4) { $("#msg").textContent = "Poucos kanji nesse nível. Escolha outro."; return; }
  $("#msg").textContent = "";
  S.i = 0; S.score = 0; S.wrong = [];
  showSec("game");
  show();
}
function show() {
  const q = S.q[S.i]; S.locked = false;
  $("#score").textContent = `${S.i + 1}/${S.q.length} · acertos: ${S.score}`;
  $("#big").textContent = q.big; $("#hint").textContent = q.hint;
  $("#feedback").textContent = ""; $("#reveal").hidden = true; $("#next").hidden = true;
  const box = $("#opts"); box.replaceChildren();
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt" + q.cls; b.lang = "ja"; b.textContent = o.label;
    b.onclick = () => answer(i);
    box.append(b);
  });
}
function answer(i) {
  if (S.locked) return; S.locked = true;
  const q = S.q[S.i], ok = q.opts[i].ok, bs = $("#opts").children;
  q.opts.forEach((o, j) => { if (bs[j]) { bs[j].disabled = true; if (o.ok) bs[j].classList.add("ok"); else if (j === i) bs[j].classList.add("bad"); } });
  if (ok) S.score++; else S.wrong.push(q.e);
  $("#feedback").textContent = ok ? "Correto!" : "Não foi dessa vez.";
  const e = q.e, r = $("#reveal");
  r.replaceChildren();
  const jp = document.createElement("div"); jp.className = "jp"; jp.lang = "ja"; jp.textContent = e.k;
  const p1 = document.createElement("div"); p1.textContent = e.mean;
  r.append(jp, p1, readingsBox(e)); r.hidden = false;
  record(e, ok);
  $("#next").hidden = false; $("#next").focus();
}
function record(e, ok) {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const st = ls.get("stats") || [];
  st.push({ data: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, atividade: "kanji", nivel: e.lv, categoria: "kanji-" + e.lv.toLowerCase(), chave: e.k + "|" + toH(base(e.all[0])), acertou: ok });
  ls.set("stats", st.slice(-5000));
}
function next() {
  if (S.i + 1 < S.q.length) { S.i++; show(); } else finish();
}
function finish() {
  showSec("result");
  const bk = "best:kanji" + (S.qm === "r2k" ? "-inverso" : ""), prev = ls.get(bk) || 0;
  $("#final").textContent = `Você acertou ${S.score} de ${S.q.length}`;
  if (S.score > prev) { ls.set(bk, S.score); $("#best").textContent = prev ? `Novo recorde! (antes: ${prev})` : "Primeiro resultado salvo como recorde."; }
  else $("#best").textContent = `Recorde: ${prev}`;
  const rv = $("#review"); rv.replaceChildren();
  if (S.wrong.length) {
    const h = document.createElement("h2"); h.textContent = "Para revisar"; rv.append(h);
    S.wrong.forEach(e => {
      const row = document.createElement("div"); row.className = "rev"; row.lang = "ja";
      const a = document.createElement("span"); a.textContent = `${e.k}　${e.mean}`;
      const b = document.createElement("span"); b.textContent = `${e.kun.join("、") || "—"} / ${e.on.join("、") || "—"}`;
      row.append(a, b); rv.append(row);
      if (KEX[e.k]) { const bx = readingsBox(e); bx.className += " rd-list"; rv.append(bx); }
    });
  }
}
// Só estudar: lista os kanji do nível com significado, leituras e (sob demanda) os exemplos; 100 por vez.
let studyList = [], studyN = 0;
function studyRow(e, open) {
  const r = document.createElement("div"); r.className = "sk"; r.lang = "ja";
  const k = document.createElement("span"); k.className = "sk-k"; k.textContent = e.k;
  const m = document.createElement("span"); m.className = "sk-m"; m.lang = "pt-BR"; m.textContent = e.mean + " · " + e.lv;
  const rd = document.createElement("span"); rd.className = "sk-r"; rd.textContent = `kun: ${e.kun.join("、") || "—"}　on: ${e.on.join("、") || "—"}`;
  r.append(k, m, rd);
  if (KEX[e.k] && open) r.append(readingsBox(e));
  else if (KEX[e.k]) {
    const d = document.createElement("details"), sm = document.createElement("summary"); sm.textContent = "exemplos"; sm.lang = "pt-BR";
    d.append(sm); d.addEventListener("toggle", () => { if (d.open && !d.querySelector(".rd-box")) d.append(readingsBox(e)); });
    r.append(d);
  }
  return r;
}
function studyMore() {
  const next = studyList.slice(studyN, studyN + 100); studyN += next.length;
  $("#study-list").append(...next.map(studyRow));
  $("#study-more").hidden = studyN >= studyList.length;
  $("#study-count").textContent = `${Math.min(studyN, studyList.length)} de ${studyList.length} kanji`;
}
function study() {
  const lv = $("#level").value; ls.set("kd-kanji-level", lv);
  studyList = ENT.filter(e => lv === "all" || e.lv === lv); studyN = 0;
  $("#study-title").textContent = lv === "all" ? "Todos os níveis" : "JLPT " + lv;
  $("#study-list").replaceChildren(); studyMore();
  showSec("study"); window.scrollTo(0, 0);
}
// Rolagem infinita: kanji do nível (ou de todos) com exemplos, em rodadas, embaralhados ou na ordem; mantém no máximo ~120 cartões na página.
let FEED = null;
function feedMore(n) {
  const list = $("#feed-list");
  for (let k = 0; k < n; k++) {
    if (FEED.i >= FEED.order.length) {
      FEED.order = FEED.cfg.shuffle ? shuffle(FEED.pool) : FEED.pool.slice(); FEED.i = 0; FEED.round++;
      $("#feed-info").textContent = `Rodada ${FEED.round} · ${FEED.pool.length} kanji`;
      if (FEED.round > 1) { const d = document.createElement("div"); d.className = "feed-sep"; d.textContent = `Rodada ${FEED.round}`; list.append(d); }
    }
    list.append(studyRow(FEED.order[FEED.i++], true));
  }
  if (list.children.length > 120) {
    const keep = list.children[40], before = keep.getBoundingClientRect().top;
    for (let k = 0; k < 40; k++) list.children[0].remove();
    window.scrollBy(0, keep.getBoundingClientRect().top - before);
  }
}
function feedStart(scope) {
  const sel = $("#feed-scope");
  if (typeof scope === "string") sel.value = scope;
  const cfg = { scope: sel.value, shuffle: $("#feed-shuffle").checked };
  ls.set("kd-kanji-feed", cfg);
  if (FEED && FEED.io) FEED.io.disconnect();
  FEED = { pool: ENT.filter(e => cfg.scope === "all" || e.lv === cfg.scope), cfg, order: [], i: 0, round: 0, io: null };
  $("#feed-list").replaceChildren();
  showSec("feed"); window.scrollTo(0, 0);
  if (!FEED.pool.length) return;
  feedMore(15);
  if ("IntersectionObserver" in window) {
    const end = $("#feed-end");
    FEED.io = new IntersectionObserver(es => { if (es[0].isIntersecting) { feedMore(10); FEED.io.unobserve(end); FEED.io.observe(end); } }, { rootMargin: "800px" });
    FEED.io.observe(end);
  }
}
function setMode(m) {
  S.mode = m; ls.set("kd-kanji-mode", m);
  if (m !== "study") { S.qm = m; ls.set("kd-kanji-qm", m); }
  ["k2r", "r2k", "study"].forEach(x => $("#m-" + x).setAttribute("aria-pressed", m === x));
  $("#go").textContent = m === "study" ? "Estudar" : "Começar";
}
const levels = [...new Set(ENT.map(e => e.lv))].sort();
$("#level").innerHTML = (levels.length > 1 ? '<option value="all">Todos os níveis</option>' : "") +
  levels.map(l => `<option value="${l}">JLPT ${l} (${ENT.filter(e => e.lv === l).length} kanji)</option>`).join("");
const sl = ls.get("kd-kanji-level"); if (sl && levels.concat("all").includes(sl) && [...$("#level").options].some(o => o.value === sl)) $("#level").value = sl;
$("#feed-scope").innerHTML = $("#level").innerHTML.replace(/ \(\d+ kanji\)/g, "");
if (levels.length <= 1) $("#feed-scope").innerHTML = `<option value="all">Todos os níveis</option>` + $("#feed-scope").innerHTML;
{ const fc = ls.get("kd-kanji-feed") || {}; $("#feed-scope").value = fc.scope || "all"; if ($("#feed-scope").value !== (fc.scope || "all")) $("#feed-scope").value = "all"; $("#feed-shuffle").checked = fc.shuffle !== false; }
setMode(S.mode);
$("#m-k2r").onclick = () => setMode("k2r");
$("#m-r2k").onclick = () => setMode("r2k");
$("#m-study").onclick = () => setMode("study");
$("#study-back").onclick = () => showSec("menu");
$("#study-more").onclick = studyMore;
$("#study-play").onclick = play;
$("#feed-open").onclick = () => feedStart($("#level").value);
$("#study-feed").onclick = () => feedStart($("#level").value);
$("#feed-scope").onchange = $("#feed-shuffle").onchange = () => feedStart();
$("#feed-back").onclick = () => { if (FEED && FEED.io) FEED.io.disconnect(); showSec("menu"); };
$("#go").onclick = start;
$("#next").onclick = next;
$("#again").onclick = play;
$("#home").onclick = () => showSec("menu");
addEventListener("keydown", e => {
  if ($("#game").hidden) return;
  if (/^[1-4]$/.test(e.key)) answer(+e.key - 1);
  else if (e.key === "Enter" && !$("#next").hidden) { e.preventDefault(); next(); }
});
</script>
</body>
</html>
